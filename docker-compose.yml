services:
  talos:
    build:
      context: ..
      dockerfile: talos_runtime/Dockerfile
    container_name: talos_agent
    security_opt:
      - seccomp:unconfined
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - TALOS_REPO_DIR=/app
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - UV_PROJECT_ENVIRONMENT=/venv
      - UV_CACHE_DIR=/tmp/.uv-cache
      - DEFAULT_MODEL=${DEFAULT_MODEL}
      - TALOS_MODEL=${TALOS_MODEL}
      - SPINE_SOCKET=/tmp/spine.sock
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_SSH_KEY=${GITHUB_SSH_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-0}
      - TALOS_MODEL=${TALOS_MODEL:-}
      - MEMORY_DIR=/memory
    volumes:
      - talos_app:/app
      - ./memory:/memory
      - spine_observability:/spine
      - ./spine_config.json:/spine/spine_config.json:ro
    networks:
      - talos_net
    depends_on:
      gate:
        condition: service_healthy

  gate:
    build:
      context: ./gate
      dockerfile: Dockerfile
    container_name: talos_gate
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"
    volumes:
      - ./memory:/memory:rw
      - ./llm_logs:/runtime_logs:rw
      - ./xray_data:/data:rw
    environment:
      - TOGETHERAI_API_KEY=${TOGETHERAI_API_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-host.docker.internal:11434}
      - MEMORY_DIR=/memory
      - RUNTIME_LOG_DIR=/runtime_logs
      - DATA_DIR=/data
      - DAILY_BUDGET_LIMIT=${DAILY_BUDGET_LIMIT:-5.00}
      - TALOS_CONTEXT_WINDOW=${TALOS_CONTEXT_WINDOW:-71680}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - talos_net

  xray:
    build:
      context: ./xray
      dockerfile: Dockerfile
    container_name: talos_xray
    ports:
      - "4040:4040"
    environment:
      - GATE_URL=http://gate:4000
      - SPINE_DIR=/spine
      - OLLAMA_HOST=${OLLAMA_HOST:-host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./xray_data:/data
      - spine_observability:/spine:rw
    depends_on:
      gate:
        condition: service_healthy
    networks:
      - talos_net

  llamacpp:
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-rocm}
    container_name: llamacpp
    shm_size: 16G
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ipc: host
    volumes:
      - ./models:/models
    ports:
      - "8000:8080"
    command:
      - -m
      - /models/${DEFAULT_MODEL}
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - -ngl
      - "999"
      - -c
      - "65536"
      - --no-warmup
      - --flash-attn
      - "on"
      - --temp
      - "1.0"
      - --top-p
      - "0.95"
      - --top-k
      - "64"
    networks:
      - talos_net

networks:
  talos_net:
    driver: bridge

volumes:
  spine_observability:
  talos_app: