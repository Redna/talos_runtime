services:
  sentinel:
    build:
      context: ./sentinel
    container_name: talos_sentinel
    environment:
      - GATE_URL=http://gate:4000
    networks:
      - talos_net
    ports:
      - "8080:8080" # Proxy
      - "8081:8081" # Web UI (Optional)
    volumes:
      - sentinel_ca:/root/.mitmproxy
      - talos_app:/app:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s = socket.socket(); s.connect(('localhost', 8080))"]
      interval: 5s
      timeout: 2s
      retries: 5

  talos:
    build:
      context: ..
      dockerfile: talos_runtime/Dockerfile
    container_name: talos_agent
    cap_add:
      - LINUX_IMMUTABLE
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - TALOS_REPO_DIR=/app
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - FORCE_FRESH_CLONE=${FORCE_FRESH_CLONE:-0}
      - UV_PROJECT_ENVIRONMENT=/venv
      - UV_CACHE_DIR=/tmp/.uv-cache
      - DEFAULT_MODEL=${DEFAULT_MODEL}
      - TALOS_MODEL=${TALOS_MODEL}
      - SPINE_SOCKET=/tmp/spine.sock
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_SSH_KEY=${GITHUB_SSH_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-0}
      - MEMORY_DIR=/app/memory
      - http_proxy=http://sentinel:8080
      - https_proxy=http://sentinel:8080
      - all_proxy=http://sentinel:8080
      - NO_PROXY=gate,xray,localhost,127.0.0.1
    volumes:
      - talos_app:/app
      - spine_observability:/spine
      - sentinel_ca:/usr/local/share/ca-certificates/sentinel:ro
      - ./spine_config.json:/spine/spine_config.json:ro
    networks:
      - talos_net
    depends_on:
      sentinel:
        condition: service_healthy
      gate:
        condition: service_healthy

  gate:
    build:
      context: ./gate
      dockerfile: Dockerfile
    container_name: talos_gate
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"
    volumes:
      - talos_app:/agent_app:rw
      - ./llm_logs:/runtime_logs:rw
      - ./xray_data:/data:rw
    environment:
      - TOGETHERAI_API_KEY=${TOGETHERAI_API_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-host.docker.internal:11434}
      - MEMORY_DIR=/agent_app/memory
      - RUNTIME_LOG_DIR=/runtime_logs
      - DATA_DIR=/data
      - DAILY_BUDGET_LIMIT=${DAILY_BUDGET_LIMIT:-5.00}
      - TALOS_CONTEXT_WINDOW=${TALOS_CONTEXT_WINDOW:-71680}
      - http_proxy=http://sentinel:8080
      - https_proxy=http://sentinel:8080
      - NO_PROXY=localhost,127.0.0.1
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - talos_net

  xray:
    build:
      context: ./xray
      dockerfile: Dockerfile
    container_name: talos_xray
    ports:
      - "4040:4040"
    environment:
      - GATE_URL=http://gate:4000
      - SPINE_DIR=/spine
      - OLLAMA_HOST=${OLLAMA_HOST:-host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./xray_data:/data
      - spine_observability:/spine:rw
    depends_on:
      gate:
        condition: service_healthy
    networks:
      - talos_net

networks:
  talos_net:
    driver: bridge

volumes:
  spine_observability:
  talos_app:
  sentinel_ca:
