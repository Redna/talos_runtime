services:
  llamacpp:
    command:
      - -m
      - /models/gemma-4-31B-it-UD-Q4_K_XL.gguf
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - -ngl
      - "999"
      - -c
      - "65536"
      - --no-warmup
      - --flash-attn
      - "on"
      - --cache-type-k
      - "q4_0"
      - --cache-type-v
      - "q4_0"
      - -b
      - "1024"
      - -ub
      - "512"
      - -np
      - "1"
      - --temp
      - "1.0"
      - --top-p
      - "0.95"
      - --top-k
      - "64"
      - --reasoning
      - "on"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 300s