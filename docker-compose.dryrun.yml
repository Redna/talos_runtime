# Dry-run compose — same architecture as the production compose, but the
# real LLM gate is swapped for the scripted dryrun_app.py.  Everything
# else (Spine, Supervisor, TalosSandbox, nono CLI, the cortex ReAct loop)
# is the real production code.
#
# Differences from the production compose:
#   - gate service uses DRYRUN_MODE=1 and DRYRUN_SCENARIO={scenario}
#   - talos service uses TALOS_DRYRUN_MODE={scenario} so the cortex
#     reads the same env var
#   - the sentinel and ollama_proxy services are dropped (no LLM, no
#     need for traffic inspection or a local model)
#   - the xray service is kept because it is a passive observer
#
# Usage:
#   docker compose -f docker-compose.dryrun.yml \
#       --env-file <(echo DRYRUN_SCENARIO=crash) up --abort-on-container-exit

services:
  talos:
    build:
      context: ..
      dockerfile: talos_runtime/Dockerfile
    container_name: talos_dryrun
    cap_add:
      - LINUX_IMMUTABLE
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 8G
        reservations:
          cpus: '0.5'
          memory: 1G
    environment:
      - PYTHONUNBUFFERED=1
      - TALOS_REPO_DIR=/app
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - FORCE_FRESH_CLONE=0
      - UV_PROJECT_ENVIRONMENT=/venv
      - UV_CACHE_DIR=/tmp/.uv-cache
      - DEFAULT_MODEL=dryrun
      - TALOS_MODEL=dryrun
      - SPINE_SOCKET=/tmp/spine.sock
      - MEMORY_DIR=/app/memory
      - TALOS_DRYRUN_MODE=${DRYRUN_SCENARIO:-happy}
      # Crash-scenario knobs (read by the cortex's dryrun_driver).
      - TALOS_DRYRUN_CRASH_AT_TURN=${DRYRUN_CRASH_AT_TURN:-6}
      - TALOS_DRYRUN_CRASH_REASON=${DRYRUN_CRASH_REASON:-simulated crash from dry-run}
      - TALOS_DRYRUN_STALL_AT_TURN=${DRYRUN_STALL_AT_TURN:-4}
      - TALOS_DRYRUN_STALL_SLEEP=${DRYRUN_STALL_SLEEP:-10000}
      # Quick stall timeouts so a single cycle of the stall scenario
      # finishes in tens of seconds, not minutes.
      - TALOS_STALL_TIMEOUT=${TALOS_STALL_TIMEOUT:-15}
    volumes:
      - talos_app:/app
      - spine_observability:/spine
      - ./spine_config.dryrun.json:/spine/spine_config.json:ro
    networks:
      - talos_internal
    depends_on:
      gate:
        condition: service_healthy

  gate:
    build:
      context: ./gate
      dockerfile: Dockerfile
    container_name: talos_dryrun_gate
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"
    environment:
      - DRYRUN_MODE=1
      - DRYRUN_SCENARIO=${DRYRUN_SCENARIO:-happy}
      - DRYRUN_LOG=/gate/dryrun_log.jsonl
    volumes:
      - talos_app:/app:rw
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - talos_internal

networks:
  talos_internal:
    driver: bridge

volumes:
  spine_observability:
  talos_app:
