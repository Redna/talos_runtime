<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talos X-ray</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header id="top-bar">
        <h1>TALOS X-RAY</h1>
        <nav id="tabs">
            <button class="tab active" data-view="overview">Overview</button>
            <button class="tab" data-view="stream">Stream</button>
        </nav>
        <div id="top-stats">
            <span id="status-badge" class="status-badge status-idle">
                <span id="status-dot">●</span>
                <span id="status-text">Idle</span>
            </span>
            <span id="model-info"></span>
            <span id="turn-count">Turn: 0</span>
            <span id="spend">Spend: $0.00</span>
            <div id="ws-status" class="status-dot"></div>

        </div>
    </header>

    <div id="context-bar">
        <div id="context-progress">
            <div id="context-fill"></div>
            <span id="context-text">0%</span>
        </div>
        <div id="token-counters">
            <span id="tokens-total">Total: 0</span>
        </div>
    </div>

    <div id="view-overview" class="view active">
        <div class="overview-grid">
            <div class="card">
                <h2>Health</h2>
                <div id="container-dots"></div>
                <div id="spine-status"></div>
                <div id="lazarus"></div>
            </div>

            <div class="card">
                <h2>Commit Timeline</h2>
                <div id="commit-info"></div>
            </div>

            <div class="card">
                <h2>Actions</h2>
                <div class="actions">
                    <button onclick="sendCommand('force_restart')">Restart</button>
                    <button id="pause-btn" onclick="sendCommand('pause')">Pause</button>
                    <button id="step-btn" onclick="sendCommand('step')" style="display:none">Next Step</button>
                    <button onclick="sendCommand('resume')">Resume</button>
                    <button onclick="sendCommand('force_fold')">Fold</button>
                </div>
            </div>
        </div>

        <div class="card card-events">
            <h2>Events</h2>
            <div id="event-list"></div>
        </div>
    </div>

    <div id="view-stream" class="view">
        <div id="transcript"></div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
